services:
  postgres:
    image: postgres:16-alpine
    container_name: orangeraie1-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orangeraie1
      POSTGRES_PASSWORD: orangeraie1dev
      POSTGRES_DB: orangeraie1_dev
      # trust pour dev local — pas de vérification de mot de passe
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orangeraie1 -d orangeraie1_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orangeraie1-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:


